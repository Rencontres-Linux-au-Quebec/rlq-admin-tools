#
# Filtre fail2ban pour le capteur catch-all (default_server) d'Odoo — voir sites-available/00-catchall-default.conf
# et son format de journal dédié (odoo-catchall-444.log, différent du format combiné standard de nginx : pas de
# User-Agent/référent entre guillemets en fin de ligne classique, mais host="..." ua="..." explicites).
#
# Toute requête qui atteint ce capteur cible l'IP brute du serveur ou un domaine non configuré — aucun visiteur
# légitime n'a de raison de le faire. D'où un seuil bas dans le jail associé (voir nginx-catchall.jail.conf) :
# contrairement aux jails qui surveillent l'access log normal (où un visiteur peut légitimement générer quelques
# 403/404 par erreur), tout ce qui apparaît ici est par nature suspect.
#
# À copier vers /etc/fail2ban/filter.d/nginx-catchall.conf (voir setup-nginx-odoo.sh, qui automatise cette copie
# en --update).

[Definition]
failregex = ^<HOST> - \[.*\] ".*" 444

ignoreregex = ^<HOST> - \[.*\] "(GET|HEAD) /(apple-touch-icon[^ ?]*|favicon\.ico)[ ?]
