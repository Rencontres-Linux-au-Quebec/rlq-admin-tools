# Filtre fail2ban : tentatives d'injection SQL dans l'URL, lues dans le journal d'acces nginx (format combined_host, adresse en tete).
# Meme signature que $is_sqli_probe (nginx/conf.d/odoo-global.conf) : UNION [ALL] SELECT, EXTRACTVALUE(, UPDATEXML(,
# ORDER BY <chiffre>, ELT(, CONCAT(0x7e, SLEEP(, BENCHMARK(. Toute requete qui correspond compte, meme si nginx l'a refusee (403)
# ou si Odoo l'a rejetee (400) : la tentative est la preuve.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "[A-Z]+ [^"]*(?i:union([\s]|%20|\+|/\*)+(all([\s]|%20|\+)+)?select|extractvalue\(|updatexml\(|order([\s]|%20|\+)+by([\s]|%20|\+)+[0-9]|elt\([0-9]|concat\(0x7e|sleep\([0-9]|benchmark\([0-9])
ignoreregex =
