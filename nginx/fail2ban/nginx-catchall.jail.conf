#
# Jail fail2ban pour le capteur catch-all d'Odoo — voir nginx-catchall.filter.conf pour le détail du choix de
# seuil (bas, car ce capteur ne reçoit jamais de trafic légitime). Ajuster port="http,https" si votre pare-feu
# gère aussi d'autres ports pour ce même service.
#
# À copier vers /etc/fail2ban/jail.d/nginx-catchall.conf (voir setup-nginx-odoo.sh, qui automatise cette copie en
# --update) — jamais fusionné dans jail.local directement, pour ne jamais risquer de modifier un fichier existant
# dont la structure peut varier d'une installation à l'autre.

[nginx-catchall]
enabled  = true
port     = http,https
filter   = nginx-catchall
logpath  = /var/log/nginx/odoo-catchall-444.log
maxretry = 10
findtime = 60
bantime  = 86400
action   = iptables-multiport[name=nginx-catchall, port="http,https", protocol=tcp]
