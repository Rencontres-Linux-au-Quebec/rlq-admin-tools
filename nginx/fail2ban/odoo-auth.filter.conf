#
# Filtre fail2ban : échecs de connexion à Odoo, lus dans le JOURNAL D'ODOO (systemd). Indispensable en plus des jails
# nginx : un mauvais mot de passe sur /web/login répond 200 (la page de connexion réaffichée avec un message
# d'erreur), donc rien ne le distingue d'une connexion normale dans les journaux nginx. Couvre TOUS les canaux, car
# Odoo journalise l'échec au même endroit (res_users._login) : formulaire web, connexion JSON, XML-RPC, JSON-RPC.
#
# Messages reconnus (vérifiés dans de vrais journaux d'Odoo) :
#   ... odoo.addons.base.models.res_users: Login failed for db:<base> login:<identifiant> from <IP>
#   ... Password reset attempt for <identifiant> by user <utilisateur> from <IP>   (auth_signup ; inondation de courriels)
# « db:<base> » est rendu facultatif pour tolérer les variations entre versions d'Odoo.
#
# PRÉREQUIS : proxy_mode = True dans odoo.conf, sinon Odoo journalise 127.0.0.1 (nginx) pour toutes les tentatives
# et fail2ban ne bannirait que nginx lui-même — setup-nginx-odoo.sh vérifie ce réglage (étape 8).
#
# À installer vers /etc/fail2ban/filter.d/odoo-auth.conf (setup-nginx-odoo.sh --update le fait).
# Tester sur le serveur (journalmatch par l'option -m, PAS entre crochets : ceux-ci n'acceptent que les parametres
# du backend comme journalflags ou journalpath) :
#   fail2ban-regex -m "_SYSTEMD_UNIT=erplibre.service" systemd-journal \
#     /etc/fail2ban/filter.d/odoo-auth.conf

[Definition]
failregex = Login failed for (?:db:\S+ )?login:.* from <HOST>\s*$
            Password reset attempt for .* by user .* from <HOST>\s*$

ignoreregex =
