# Jail fail2ban : une adresse qui envoie des tentatives d'injection SQL dans l'URL est bannie 24 h.
# Seuil bas (3 tentatives en 10 min) : aucune requete legitime de Odoo ne contient ces constructions.
# Le filtre lit les journaux d'acces nginx (*access*.log), y compris ceux des autres applications derriere nginx.
[nginx-sqli]
enabled  = true
port     = http,https
filter   = nginx-sqli
logpath  = /var/log/nginx/*access*.log
maxretry = 3
findtime = 600
bantime  = 86400
action   = iptables-multiport[name=nginx-sqli, port="http,https", protocol=tcp]
