# ============================================================================
# Detection des robots/scanners a bloquer, utilisee par les regles "if ($is_bad_bot)"
# ============================================================================
# Chaque entree ci-dessous correspond a une chaine trouvee dans le header User-Agent.
# La comparaison ~* est insensible a la casse et cherche une correspondance partout
# dans la chaine (sauf pour le second bloc, ancre avec ^ pour eviter les faux positifs).
map $http_user_agent $is_bad_bot {
    default 0;

    # --- Crawlers SEO commerciaux (backlinks, audits, analyse concurrentielle) --------
    # Legitimes mais non sollicites : ils consomment de la bande passante et exposent
    # la structure du site a des outils d'espionnage concurrentiel (backlinks, mots-cles).
    # AhrefsBot (Ahrefs), MJ12bot (Majestic), SemrushBot (Semrush), DotBot (Moz),
    # DataForSeoBot (DataForSEO), PetalBot (moteur Petal Search de Huawei),
    # SERankingBacklinksBot (SE Ranking — observe explorant les combinaisons de filtres
    # /event?tags=[..]&date=.. de la page evenements, un piege a facettes couteux en ressources),
    # GeedoShopProductFinder (agregateur/comparateur de fiches produits, pertinent vu la boutique
    # /shop — reparti sur plusieurs IP 83.99.206.x, echappe donc a une limitation par IP seule).
    ~*(AhrefsBot|MJ12bot|SemrushBot|DotBot|DataForSeoBot|PetalBot|SERankingBacklinksBot|GeedoShopProductFinder) 1;

    # --- Crawlers d'entrainement IA / aspiration massive de contenu -------------------
    # Ces robots aspirent le contenu du site pour entrainer des modeles de langage ou
    # alimenter des index de recherche, generalement sans compensation ni consentement.
    # Bytespider (ByteDance/TikTok, tres agressif), CCBot (Common Crawl, alimente
    # de nombreux jeux de donnees IA), GPTBot (OpenAI), Amazonbot (Amazon/Alexa),
    # ClaudeBot et Claude-SearchBot (Anthropic, indexation/entrainement).
    # Note : Claude-User (distinct de ClaudeBot) N'EST PAS inclus ici volontairement,
    # voir l'avertissement plus haut - il sert aux requetes ponctuelles demandees
    # par un utilisateur humain via Claude, pas a du crawling automatise.
    #
    # meta-externalagent (Meta) N'EST PLUS bloque ici volontairement : ce meme robot sert
    # aussi a generer les apercus de liens partages sur Facebook/Messenger/Instagram
    # (image, titre, description). Le bloquer cassait ces apercus pour les evenements
    # partages par les benevoles. Compromis assume : un peu plus d'aspiration de contenu
    # par Meta pour entrainement IA, en echange d'apercus de partage qui fonctionnent.
    ~*(Bytespider|CCBot|GPTBot|Amazonbot|ClaudeBot|Claude-SearchBot) 1;

    # --- Scanners de securite / reconnaissance internet-wide ---------------------------
    # Ces outils ne cherchent pas du contenu mais cartographient les serveurs exposes
    # sur Internet (ports ouverts, versions logicielles, vulnerabilites potentielles).
    # CensysInspect et shodan (moteurs de recherche IoT/scan internet-wide, exploites
    # aussi bien par des chercheurs en securite que par des attaquants en reconnaissance),
    # masscan et zgrab (outils de scan de masse tres rapides, projet ZMap),
    # Palo Alto Networks (Cortex Xpanse, cartographie de surface d'attaque),
    # LeakIX (moteur de scan/indexation de vulnerabilites exposees, leakix.net),
    # l9scan (observe dans les journaux de ce serveur, categorie scan/reconnaissance),
    # jscrawler (se presente comme un crawler benin avec un depot GitHub en lien, mais sonde ensuite
    # .env, .aws/credentials, server-status, debug/vars dans nos propres journaux : comportement de
    # scanner de vulnerabilites derriere un User-Agent construit pour paraitre legitime),
    # poc-suite (nom explicite d'un framework d'exploitation de vulnerabilites — "Proof of Concept suite").
    ~*(CensysInspect|shodan|masscan|zgrab|Palo\ Alto\ Networks|LeakIX|l9scan|jscrawler|poc-suite) 1;

    # --- Signatures suspectes non documentees publiquement -----------------------------
    # Ces chaines ne correspondent a aucun robot officiel repertorie publiquement au
    # moment de la redaction. Probablement des scrapers/scanners maison ou peu diffuses
    # deja observes dans les logs de ce serveur. A reevaluer si un faux positif survient
    # (verifier alors le comportement reel de la requete avant de les retirer).
    ~*(AteveSearchSourceUrlDiscovery|CyberConvoyScout|ForestEngine|Infrawatch|Reflectionbot|visionheight) 1;

    # --- Clients HTTP en ligne de commande sans UA personnalise -------------------------
    # python-requests, Wget et leurs semblables sont les bibliotheques/outils par defaut utilises par
    # la quasi-totalite des scripts d'attaque automatises (exploitation de failles connues,
    # brute force, scraping basique) car ils ne changent jamais leur UA par defaut.
    # curl n'est PAS bloque ici (v1.12) : un humain qui utilise curl est autorise. Seule une rafale
    # importante (plus de 10 requetes d'un coup, meme IP) est limitee par la zone odoo_curl_v2
    # (conf.d/odoo-global.conf, appliquee dans securite-commune.conf et dans les location).
    # python-httpx (successeur moderne de python-requests) et Python-urllib (client HTTP
    # integre a Python) : meme famille d'outils. python-httpx observe en PROD le 2026-09-23 :
    # 18.226.62.38 (instance AWS EC2 generique) alternait python-httpx/0.28.1 et un faux
    # User-Agent Chrome, ~9 requetes/s en parallele — assez pour provoquer 15 conflits de mise
    # a jour simultanee sur website_visitor cote Odoo (sans gravite, rejoues automatiquement).
    # ATTENTION : si un script/webhook/health-check LEGITIME appelle ce serveur depuis
    # l'exterieur avec un de ces clients sans UA personnalise, il sera aussi bloque.
    # Verifier qu'aucune integration connue n'en depend avant d'activer cette ligne.
    ~*^(python-requests|python-httpx|python-urllib|Wget)/ 1;
}

# ============================================================================
# Exception /robots.txt : un bad bot doit pouvoir LIRE les consignes de robots.txt (dont son propre
# Disallow), sinon il ne les voit jamais et n'a aucune raison de les respecter — contre-productif.
# ============================================================================
# La regle "if ($is_bad_bot) { return 403; }" (securite-commune.conf, regle 1) est au niveau server,
# executee pendant la phase de reecriture, AVANT toute selection de location — un simple
# "location = /robots.txt" avec allow ne peut donc jamais intercepter ce cas, cette regle s'execute
# toujours en premier. Solution : combiner $is_bad_bot et $uri dans une seule variable via un map sur la
# CONCATENATION des deux ("$is_bad_bot$uri"), et faire tester CETTE variable a la regle 1 a la place de
# $is_bad_bot brut. Seul le chemin exact "/robots.txt" est exempte ; tout le reste du site reste bloque
# normalement pour ces UA.
map $is_bad_bot$uri $is_bad_bot_enforced {
    default $is_bad_bot;
    "1/robots.txt" 0;
}
