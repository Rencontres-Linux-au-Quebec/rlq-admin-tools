# ======================================================================================================================
# odoo-global.conf — directives http{} partagées par TOUTES les instances Odoo de ce serveur.
# À placer dans /etc/nginx/conf.d/ (chargé une seule fois pour tout nginx, jamais dans sites-available/).
# ======================================================================================================================

# server_tokens off; n'est PAS déclaré ici : le nginx.conf par défaut de Debian l'inclut déjà (recommandation
# standard du paquet) dans le même contexte http{} que ce fichier — le redéclarer ferait planter le chargement
# ("directive is duplicate"). Si votre nginx.conf ne l'a pas, ajoutez-le là plutôt qu'ici.

# Détecte les requêtes de mise à niveau websocket pour ne passer en mode "upgrade" que lorsque c'est réellement demandé :
# le reste du trafic HTTP garde le keep-alive normal vers Odoo (gain de perf sur les requêtes JSON).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Identifie les requêtes qui proviennent de la machine elle-même (curl/wget lancés localement pour tester ou pour un
# health-check), utilisé par securite-commune.conf pour exempter ces requêtes du blocage bad-bot par User-Agent —
# sans jamais lever ce blocage pour un vrai client externe (voir le commentaire détaillé dans securite-commune.conf).
# Pour tester en tant que "local" avec curl sans dépendre du DNS : curl -H "Host: <votre-domaine>" -k
# https://127.0.0.1/... (le -k est nécessaire car le certificat ne couvre pas "127.0.0.1").
geo $is_internal_client {
    default   0;
    127.0.0.1 1;
    ::1       1;
}

# Liste des IP de confiance (équipe technique) — les mêmes que les allow-lists /web/database/manager dans les
# fichiers env-*.conf. GARDER CES DEUX LISTES SYNCHRONISÉES MANUELLEMENT : "allow" (env-*.conf) n'accepte pas de
# variable, donc cette liste doit être dupliquée ici plutôt que partagée dynamiquement.
# Sert à exempter ces IP de la limitation de débit (limit_req, plus bas) : un usage normal et intensif du backend
# Odoo (ouverture de vues complexes, plusieurs appels AJAX rapides comme get_web_dialog_size_config) peut légitimement
# dépasser les seuils prévus pour du trafic public anonyme. Observé concrètement : un bénévole bloqué en 429 pendant
# un usage normal du backend, alors que la même IP est déjà de confiance ailleurs dans cette config.
geo $is_trusted_ip {
    default        0;
    include /etc/nginx/snippets/team-ips-geo.conf;   # adresses de l'équipe : GÉNÉRÉ depuis /etc/default/nginx-tools-white-list.conf (nginx-hardening.sh)
}

# Clé de limitation vide = pas de limite appliquée pour cette requête (comportement documenté de limit_req_zone).
map $is_trusted_ip $limit_key_general {
    1       "";
    default $binary_remote_addr;
}

# RÉSEAUX PARTAGÉS (université…) : les adresses des lieux marqués [partagée] dans /etc/default/nginx-tools-ip-location.conf (fichier GÉNÉRÉ par
# nginx-hardening.sh --update : /etc/nginx/snippets/shared-ips-geo.conf) servent des dizaines de personnes derrière UNE adresse. Elles ont leurs propres zones,
# plus larges (3 fois le débit général, 5 fois les tentatives de connexion), pour qu'une salle qui s'inscrit ou répond à un sondage en même temps ne reçoive pas de 429.
# Chaque zone n'a de clé que pour son groupe : une adresse ordinaire ne voit que les zones « standard », une adresse partagée que les zones « partage ».
geo $is_shared_ip {
    default 0;
    include /etc/nginx/snippets/shared-ips-geo.conf;   # GÉNÉRÉ depuis les lieux [partagée] (nginx-hardening.sh) : doit exister, même vide
}
map "$is_shared_ip:$limit_key_general" $limit_key_general_std {
    "~^0:(.+)$"  $1;
    default      "";
}
map "$is_shared_ip:$limit_key_general" $limit_key_general_partage {
    "~^1:(.+)$"  $1;
    default      "";
}

# Zone de cache mémoire pour les fichiers statiques Odoo (JS/CSS compilés). Une seule instance étant active par serveur
# pour l'instant, elle suffit ; si plusieurs instances tournent un jour côte à côte, $host fait déjà partie de la clé de
# cache par défaut, donc aucune collision entre instances.
proxy_cache_path /var/cache/nginx/odoo levels=1:2 keys_zone=odoo_cache:10m max_size=1g inactive=60m use_temp_path=off;

# ------------------------------------------------------------------------------------------------------------------
# Journalisation dédiée aux connexions coupées par le capteur "default_server" (return 444) et par les gardes-fous
# "error_page 400 =444" présents dans les vhosts. Objectif : isoler ce bruit (scans, sondes, IP au hasard, Host non
# déclaré) du log d'accès normal des instances Odoo, pour repérer plus facilement les patterns d'attaque.
# $http_host est loggé tel quel (peut être vide ou forgé par l'attaquant) : utile pour voir ce qui était visé.
# ------------------------------------------------------------------------------------------------------------------
log_format catchall444 '$remote_addr - [$time_local] "$request" $status host="$http_host" ua="$http_user_agent"';

# Journal des sites Odoo : format standard « combined » + nom de domaine demandé ($host) EN FIN de ligne. Tout ce qui
# lit ces journaux reste valable (champs inchangés, dans le même ordre) : filtres fail2ban ancrés au début de ligne,
# découpage awk sur les guillemets (User-Agent = 6e champ), web-monitor.py. Le nom permet de savoir par quel bloc
# server une requête est arrivée (ex. www, domaine nu, nom technique du serveur). 1.11 : « rl=$request_length » (taille de la
# requête reçue, en-têtes compris) TOUT À LA FIN : web-monitor.py --list-users --table en tire les Mo envoyés par chaque compte.
log_format combined_host '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" host="$host" rl=$request_length';

# $is_bad_bot (utilisée par securite-commune.conf) est définie dans bot_blocker.conf, livré à côté de ce fichier et
# chargé lui aussi depuis /etc/nginx/conf.d/ : les deux sont donc lus une seule fois, dans le même contexte http.
# Ne PAS redéfinir ce map ailleurs, sous peine de "duplicate map variable" au chargement de nginx.

# ------------------------------------------------------------------------------------------------------------------
# Limitation de débit par IP (protection contre l'énumération automatisée qui ne matche aucune signature de bot).
# Renvoie 429 (Too Many Requests) plutôt que le 503 par défaut de nginx — plus juste sémantiquement, et plus clair
# a lire dans les logs/outils de supervision qu'une vraie surcharge serveur.
# ------------------------------------------------------------------------------------------------------------------
limit_req_status 429;

# Garde-fou général, généreux : ne vise pas un pattern précis, juste une limite haute contre un abus grossier
# (DoS applicatif basique). 30 req/s + une rafale de 60 sans délai couvre largement le chargement d'une page Odoo
# normale (JS/CSS/images en parallèle) sans jamais gêner un vrai visiteur. Clé = $limit_key_general (vide pour les
# IP de confiance ci-dessus, donc jamais limitées) plutôt que $binary_remote_addr directement.
limit_req_zone $limit_key_general_std zone=odoo_general:10m rate=30r/s;
limit_req_zone $limit_key_general_partage zone=odoo_general_partage:10m rate=90r/s;      # réseaux partagés : 3 fois plus

# Zone dédiée et BEAUCOUP plus stricte pour /web_editor/shape/ (générateur de formes SVG décoratives du constructeur
# de site) : une page réelle en demande rarement plus de 1-2 par chargement, jamais des dizaines à la suite. Observé
# dans nos logs : un outil énumérant méthodiquement chaque variante (Rainy/01, 01_001, 02...) avec des paramètres de
# couleur vides, ~1 requête toutes les 2-3 secondes par IP — trop lent pour qu'une limite générale (ci-dessus) le
# remarque, mais nettement au-dessus de tout usage légitime soutenu dans le temps.
# 1.16 : plus utilisée par /web_editor/shape/ (voir _odoo-common.conf) ; conservée pour mémoire, sans effet.
limit_req_zone $binary_remote_addr zone=odoo_shapes:10m rate=20r/m;

# Curl en rafale (v1.12, seuil assoupli en v1.13) : rate=12r/m = une requete toutes les 5 secondes en regime
# permanent, burst=10 : jusqu'a 10 requetes curl d'un coup depuis la meme IP (un humain qui tape quelques
# commandes passe), au-dela 429.
# Ne vise que le User-Agent "curl/..." ; exemptees : la machine elle-meme ($is_internal_client, voir plus haut) et
# les IP de confiance ($is_trusted_ip). Cle vide = pas de limite pour tout le reste.
map $http_user_agent $is_curl_client {
    default   0;
    "~*^curl/" 1;
}
map "$is_curl_client:$is_internal_client:$is_trusted_ip" $limit_key_curl {
    "1:0:0"  $binary_remote_addr;
    default  "";
}
limit_req_zone $limit_key_curl zone=odoo_curl:10m rate=12r/m;

# /robots.txt « tout interdit » pour les instances non publiques (DEV non indexable) : DEV (selon sa configuration) peut refuser tout visiteur
# hors liste blanche (deny all dans env-dev.conf), robots.txt compris — les robots polis ne reçoivent donc jamais la
# consigne d'arrêter et reviennent sans fin, ce qui remplit les journaux de 403. Avec ce map, la location
# /robots.txt de _odoo-common.conf répond directement « Disallow: / » à TOUT LE MONDE pour ces noms (la réponse est
# produite avant le contrôle d'accès par IP), et continue d'interroger Odoo pour PROD. Clé : $server_name, le nom
# principal du bloc server (jamais l'en-tête Host envoyé par le client, falsifiable). Défini ici (http{}, toujours
# chargé) plutôt que par un « set » dans env-dev.conf : sur un serveur où seul le vhost PROD est activé, env-dev.conf
# n'est jamais inclus, et une variable inconnue ferait échouer « nginx -t ». Ajouter ici toute autre instance non
# publique (ex. LAB) qui doit refuser l'indexation.
map $server_name $robots_disallow_all {
    default                              0;
    include /etc/nginx/snippets/robots-disallow.conf;   # noms d'instance non publics : fichier PROPRE AU SITE (zip de configuration du site), doit exister, même vide
}

# Limite dédiée aux TENTATIVES DE CONNEXION (protection contre la force brute) : POST sur /web/login (avec ou sans
# préfixe de langue, ex. /en_CA/web/login), sur /web/login/totp (code de double authentification : 6 chiffres qu'il
# faut empêcher d'essayer en série) et sur /web/session/authenticate (connexion JSON, applications mobiles).
# Clé vide pour tout le reste (affichage de la page de connexion en GET, navigation normale) et pour les IP de
# confiance : aucune limite dans ces cas. 5 tentatives par minute et par IP, avec une réserve de 5 (burst, voir
# _odoo-common.conf) : un humain qui se trompe de mot de passe n'est jamais gêné ; un robot est ramené à une
# tentative toutes les 12 secondes et reçoit 429. Complété par le jail fail2ban « odoo-auth », qui lit les échecs
# dans le journal d'Odoo (un mauvais mot de passe répond 200 : invisible pour les jails nginx) et bannit l'IP.
map "$is_trusted_ip:$request_method:$uri" $limit_key_login {
    default                                                             "";
    "~^0:POST:(/[a-z]{2}(_[A-Z]{2})?)?/web/(login(/totp)?|session/authenticate)$"  $binary_remote_addr;
}
map "$is_shared_ip:$limit_key_login" $limit_key_login_std {
    "~^0:(.+)$"  $1;
    default      "";
}
map "$is_shared_ip:$limit_key_login" $limit_key_login_partage {
    "~^1:(.+)$"  $1;
    default      "";
}
limit_req_zone $limit_key_login_std zone=odoo_login:10m rate=5r/m;
limit_req_zone $limit_key_login_partage zone=odoo_login_partage:10m rate=25r/m;      # réseaux partagés : 5 fois plus (une salle qui se connecte en même temps)

# Limite de connexions SIMULTANÉES par cookie de visiteur (cookie « visitor_uuid » du module website d'Odoo). Odoo enregistre le visiteur à chaque page
# (website_visitor) : plusieurs requêtes dynamiques EN PARALLÈLE avec le même cookie se disputent la même ligne de la base (« could not serialize access due to
# concurrent update », « bad query … INSERT » dans le journal d'Odoo) et, après 5 essais, répondent 5xx. Un navigateur normal en a au plus quelques-unes à la fois ;
# un outil qui en lance des dizaines avec le même cookie, non. La clé est le COOKIE, jamais l'adresse : plusieurs personnes derrière une même adresse (université) qui
# s'inscrivent ou répondent à un sondage en même temps ont chacune leur cookie et ne se gênent pas. 8 connexions simultanées par cookie, puis 429 (limit_conn_status). Clé vide (aucun cookie, ou IP de
# confiance) = aucune limite. Ne vise que « location / » (pages et appels Odoo) : fichiers statiques et /websocket ont leurs propres locations.
# Détection côté serveur : nginx-log-audit.sh, section [11].
limit_conn_status 429;
limit_conn_log_level warn;
map "$is_trusted_ip:$cookie_visitor_uuid" $limit_key_visiteur {
    default      "";
    "~^0:(.+)$"  $1;
}
limit_conn_zone $limit_key_visiteur zone=odoo_visiteur:10m;
