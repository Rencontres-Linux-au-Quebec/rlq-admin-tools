# ============================================================
# Regles de durcissement nginx pour serveur Odoo 18 CE
# ============================================================

# ------------------------------------------------------------
# 1. Rejeter les robots d'indexation superflus et les scripts d'aspiration
# ------------------------------------------------------------
# Pourquoi : $is_bad_bot est defini via un bloc "map" (souvent sur le User-Agent) qui identifie les
# crawlers agressifs, scrapers de contenu et outils d'aspiration (ex. HTTrack, SEO bots non desires).
# Bloque : la charge serveur causee par l'aspiration complete du site et le vol de contenu par scraping.
# Impact Odoo : aucun, Odoo ne depend jamais du User-Agent pour fonctionner correctement.
#
# Exception : une requete originaire de la machine elle-meme (127.0.0.1/::1, voir $is_internal_client dans
# conf.d/odoo-global.conf) desactive ce blocage, meme si son User-Agent ressemble a curl/Wget/python-requests.
# Objectif : permettre de tester le site avec curl DEPUIS le serveur (diagnostics, health-check) sans jamais
# lever la restriction pour un curl venant de l'exterieur. Un paquet reseau externe ne peut normalement pas se
# faire passer pour du 127.0.0.1 (le noyau Linux rejette par defaut ces paquets "martian" sur une interface
# reseau reelle) : cette exception n'ouvre donc pas de contournement exploitable depuis l'exterieur.
if ($is_internal_client) {
    set $is_bad_bot 0;
}
# Même exception pour une requête de la machine vers ELLE-MÊME par son adresse publique : Odoo appelle parfois son propre nom public
# avec python-requests (ex. mass_mailing : https://<site>/mass_mailing_themes). Le DNS donne alors l'adresse publique du serveur : la
# requête arrive avec $remote_addr == $server_addr (et non 127.0.0.1) et recevait un 403 de la règle 1 (« Client Error: Forbidden »
# dans le journal d'Odoo). Un client externe ne peut pas avoir l'adresse de destination du serveur comme adresse source.
if ($remote_addr = $server_addr) {
    set $is_bad_bot 0;
}
# $is_bad_bot_enforced (definie dans bot_blocker.conf) est identique a $is_bad_bot SAUF pour /robots.txt,
# toujours exempte meme pour un bad bot reconnu — voir le commentaire a cote de sa definition.
if ($is_bad_bot_enforced) {
    return 403;
}

# ------------------------------------------------------------
# 1 bis. Curl en rafale : un humain passe, un script qui martele est limite (v1.13)
# ------------------------------------------------------------
# Zone odoo_curl (conf.d/odoo-global.conf). Au niveau server, cette limite est heritee par les location qui ne
# declarent pas de limit_req. Les location qui en declarent deja (location /, icone d'accueil, formes du site)
# la repetent explicitement, car nginx ne fusionne pas les limit_req d'un niveau parent et d'un niveau enfant.
# rate=12r/m (une requete toutes les 5 s en regime permanent) avec burst=10 nodelay : une rafale de
# 10 requetes curl est acceptee d'un coup (quelques commandes tapees par un humain), puis la cadence
# est ramenee a une par 5 s ; au-dela, refus immediat (429). Un curl isole, ou quelques curl enchaines, passent.
limit_req zone=odoo_curl burst=10 nodelay;

# ------------------------------------------------------------
# 2. Rejeter les methodes HTTP non applicatives
# ------------------------------------------------------------
# Pourquoi : seules GET, HEAD et POST sont utilisees par Odoo (web, JSON-RPC, XML-RPC, portail client).
# Bloque : TRACE (cross-site tracing / vol de cookies), tentatives via PUT/DELETE, bruit de scanners.
# Impact Odoo : aucun, sauf si une API REST maison (module tiers) utilise OPTIONS pour du CORS.
if ($request_method !~ ^(GET|HEAD|POST)$ ) {
    return 405;
}

# ------------------------------------------------------------
# 3. Bloquer l'encodage de contournement et la traversee de repertoires
# ------------------------------------------------------------
# Pourquoi : "%2e%2e" est l'encodage URL de ".." (point-point), utilise pour deguiser une traversee de repertoire et
# contourner des filtres bases sur le caractere litteral. Version resserree par rapport a l'original (qui matchait
# "%2e" seul : un point encode isole peut apparaitre dans du contenu legitime sans etre une tentative de traversee ;
# seule la SEQUENCE DOUBLE point-point, encodee ou non, slash ou backslash, est un signal fiable).
# Bloque : la traversee de repertoire (path traversal, "../" ou son equivalent Windows "..\") visant a lire des
# fichiers hors de la racine web, y compris la variante encodee — PAS SEULEMENT dans le CHEMIN de l'URI, mais
# aussi dans sa QUERY STRING ($request_uri couvre les deux, contrairement a $uri qui exclut la query string) :
# un outil peut tres bien transmettre "../" dans la VALEUR d'un parametre (ex. ?file=../conf/conf.php) plutot que
# dans le chemin lui-meme, et Odoo peut ensuite utiliser cette valeur pour lire un fichier arbitraire s'il ne la
# valide pas correctement de son cote — nginx ne peut pas savoir si Odoo la validera, donc il vaut mieux bloquer
# ce signal la ou il apparait, meme dans une query string.
# Couvre aussi les combinaisons MIXTES point/separateur (l'un encode, l'autre litteral) : un outil peut par exemple
# encoder uniquement le slash sans encoder les points (".." litteral suivi de "%2f"), ce qui echapperait a une
# regle qui n'accepterait que "point ET separateur tous deux encodes, ou tous deux litteraux".
# Impact Odoo : aucun, Odoo ne genere jamais ce type d'URI en usage normal (verifie : un nom de fichier avec deux
# points SEPARES, ex. "photo.16x9.webp", ne contient pas ".." et n'est donc jamais bloque par cette regle).
#
# ATTENTION en cas de modification de cette ligne : nginx fusionne chaque paire "\\" en UN SEUL backslash lors de la
# lecture du fichier de config, AVANT que PCRE ne compile la regex. Pour que PCRE recoive "\\" (backslash echappe,
# matche UN backslash litteral dans l'URI), il faut donc ECRIRE QUATRE backslashs ("\\\\") dans ce fichier — deux
# suffiraient pour PCRE seul, mais nginx en avale la moitie avant. Un mauvais compte ici (comme "\.\.\\" ) produit un
# backslash orphelin qui echappe la parenthese fermante suivante ET fait echouer "nginx -t" avec une erreur PCRE
# cryptique ("missing closing parenthesis") plutot qu'un message clair sur le compte de backslashs.
if ($request_uri ~* "(%2e%2e|\.\.(/|\\\\|%2f|%5c))") {
    return 404;
}

# ------------------------------------------------------------
# 3 bis. Bloquer l'injection SQL dans l'URL (2026-10-28)
# ------------------------------------------------------------
# Pourquoi : des robots envoient UNION ALL SELECT, EXTRACTVALUE, ORDER BY n dans le parametre order= de /es/shop. Odoo rejetait
# ces requetes (400), mais elles arrivaient jusqu'a lui et aucune jail ne les sanctionnait.
# Bloque : la requete est refusee ici, avant Odoo. La map $is_sqli_probe (conf.d/odoo-global.conf) fait le reperage ;
# la requete reste visible dans le journal d'acces, ou le jail fail2ban nginx-sqli compte les tentatives et bannit l'adresse.
# Impact Odoo : aucun, Odoo n'utilise jamais ces constructions en usage normal.
if ($is_sqli_probe) {
    return 403;
}

# ------------------------------------------------------------
# 4. Bloquer les fichiers et dossiers caches (.env, .git, etc.)
# ------------------------------------------------------------
# Pourquoi : les fichiers commencant par un point (.git, .env, .htaccess) contiennent souvent des
# secrets ou de l'historique de code source et ne doivent jamais etre servis publiquement.
# Bloque : la fuite de depots Git complets, de cles API/mots de passe dans .env.
# Impact Odoo : aucun, Odoo n'expose rien sous un chemin commencant par un point.
# Refus journalisés À PART (blocked-probes.log, format combined_host) plutôt que « access_log off » : le journal du
# site reste propre, et fail2ban (jail nginx-blocked-probes) bannit les clients qui les accumulent — avec
# « access_log off », ces requêtes, les plus fréquentes chez les scanners, étaient invisibles de toute jail.
location ~ /\. {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}

# ------------------------------------------------------------
# 5. Bloquer les extensions sensibles et scripts executables
# ------------------------------------------------------------
# Pourquoi : ces extensions correspondent a des sauvegardes, configs, code source ou scripts qui ne
# doivent jamais etre accessibles directement en HTTP.
# Bloque : fuite de .env/.ini (identifiants BD), sauvegardes .bak/.sql (dumps complets), code .py/.php.
# ATTENTION Odoo : les pieces jointes sont servies via /web/content/<id>/<nom_original_du_fichier>.
# Un fichier uploade "rapport.txt" ou "export.sql" verrait son extension a la fin de cette URL.
# Le lookahead negatif exclut web/content, web/image et web/binary de ce filtre pour ne rien casser.
#
# BUG CORRIGE : "txt" dans la liste ci-dessous bloquait aussi /robots.txt (genere dynamiquement par Odoo,
# controller du module website), car le lookahead negatif ne couvrait que les 3 prefixes /web/... et jamais
# la racine du site. Resultat observe : /robots.txt renvoyait un 404 nginx au lieu du vrai contenu genere par
# Odoo — invisible pour les moteurs de recherche, qui ne trouvent alors ni les directives d'exploration ni le
# lien vers le sitemap. L'exception exacte pour /robots.txt vit dans _odoo-common.conf (pas ici) : ce fichier
# (securite-commune.conf) est inclus AUSSI par les blocs HTTP port 80, ou $odoo_backend n'est jamais defini
# (seuls les vhosts HTTPS font le "set $odoo_backend ...;") — y placer un proxy_pass vers $odoo_backend y
# produirait "invalid URL prefix in http://" (variable vide). Un "location =" reste prioritaire sur la regex
# ci-dessous peu importe le fichier d'origine, tant que les deux sont dans le meme bloc server : le deplacement
# ne change donc rien au comportement sur les vhosts HTTPS, seulement sur le port 80 (qui n'a plus a proxifier
# robots.txt vers Odoo puisqu'il redirige de toute facon tout le reste vers https).
location ~* ^/(?!web/content|web/image|web/binary).*\.(asp|aspx|bak|backup|cgi|config|dist|enc|env|ini|jsp|key|lock|old|orig|pem|phar|php|phtml|properties|py|rb|save|sh|sql|tfstate|txt|yaml|yml|~)$ {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}

# ------------------------------------------------------------
# 6. Bloquer les dossiers tiers, cadriciels et fausses adresses
# ------------------------------------------------------------
# Pourquoi : ces chemins visent des frameworks PHP (Laravel, ThinkPHP, Drupal), des outils de test
# (PHPUnit) ou des artefacts de scan automatise (vendor/, null, undefined).
# Bloque : l'exploitation de CVE connues sur ces frameworks (ex. RCE ThinkPHP tres ciblees par bots).
# Impact Odoo : aucun chevauchement, ces chemins n'existent pas dans une installation Odoo standard.
location ~* /(containers|drupal|laravel|null|pearcmd|phpunit|thinkphp|undefined|vendor) {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}

# ------------------------------------------------------------
# 7. Bloquer les sondes d'equipements, DNS et services tiers
# ------------------------------------------------------------
# Pourquoi : ces chemins ciblent des routeurs/modems (boaform, GponForm, HNAP1 - botnets IoT type
# Mirai), des serveurs DNS-over-HTTPS (dns-query, resolve) ou des cameras IP (onvif).
# Bloque : l'exploitation automatisee de materiel reseau, envoyee en masse sans rapport avec Odoo.
# Impact Odoo : aucun chevauchement.
location ~* ^/(boaform/|developmentserver|dns-query|GponForm/|HNAP1|onvif|query|resolve|SDK) {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}

# ------------------------------------------------------------
# 8. Bloquer xmlrpc.php (sondes WordPress) sans casser l'API Odoo
# ------------------------------------------------------------
# Pourquoi : "xmlrpc.php" est propre a WordPress, cible en masse pour de la force brute ou du DDoS
# par amplification (pingback). L'API XML-RPC reelle d'Odoo vit sous /xmlrpc/2/common et /xmlrpc/2/object.
# Le log analyse montre 95% de bruit WordPress mais 2 requetes cibleaient /xmlrpc/2/common avec des
# User-Agent suspects. Cette regle bloque seulement xmlrpc.php et laisse l'API Odoo intacte.
# Bloque : le bruit des scanners WordPress et la force brute sur un fichier qui n'existe pas dans Odoo.
location ~* ^/(?:[a-z_]+/)?xmlrpc\.php {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}

# ------------------------------------------------------------
# 9. Bloquer les sondes d'outils tiers, CMS et diagnostics externes
# ------------------------------------------------------------
# Pourquoi : ces chemins ciblent HubSpot (_hcms), Spring Boot Actuator (expose heap dumps si mal
# configure), une route Rails/API generique, WordPress (wp-admin, wp-login, wp-includes, wp-content, wp-json), le module mod_status
# d'Apache (server-status, expose l'etat interne du serveur/les IP des visiteurs) et le package
# expvar de Go (debug/vars, expose des variables internes de debogage).
# Bloque : la decouverte d'endpoints de diagnostic mal securises et le bruit de scanners CMS.
# Impact Odoo : aucun chevauchement avec les routes standards (/web/, /website/, /shop/, /my/).
# Prefixe de langue facultatif (/en_CA/wp-admin/, /fr/wp-admin/) : Odoo redirige /wp-admin/ vers /en_CA/wp-admin/, et les scanners
# suivent la redirection. Sans cette regle, /wp-admin/ (un repertoire, pas un .php) traversait nginx : Odoo repondait 303 puis sa
# page 404 de 32 Ko, comptee « transmise a Odoo » (2026-10-02).
# Expression ENTRE GUILLEMETS : nginx refuse une accolade « {2} » non protegee dans une expression reguliere.
location ~* "^/(?:[a-z]{2}(?:_[A-Z]{2})?/)?(_hcms|actuator|api/session|wp-admin|wp-content|wp-includes|wp-json|wp-login|server-status|debug/vars|wp(?:-[a-z]+)?(?:/|$)|wordpress(?:/|$))" {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}

# ------------------------------------------------------------
# 10. Bloquer les fichiers d'identifiants et de secrets au format JSON
# ------------------------------------------------------------
# Pourquoi : ces noms correspondent a des formats standards de secrets (config AWS, comptes de
# service GCP, "secrets.json" generique utilise par des frameworks Node.js/Python).
# Bloque : la fuite de cles cloud si un tel fichier a ete place par erreur dans un dossier public.
# Impact Odoo : ces noms ne correspondent a aucune route Odoo standard.
location ~* /(awsconfiguration|config|secrets|service_account)\.json$ {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}

# ------------------------------------------------------------
# 11. Bloquer les sondes GraphQL et les prefixes d'API generiques
# ------------------------------------------------------------
# Pourquoi : "/graphql" et un prefixe "/api" generique sont systematiquement sondes par les scanners qui cherchent
# une introspection GraphQL exposee ou une API REST non authentifiee (Node.js/Express, Strapi, Hasura, etc.).
# Bloque : /graphql, /graphql/..., /api, /api/... (donc aussi /api/graphql).
# Impact Odoo : AUCUNE route standard d'Odoo Community ne vit sous ces prefixes (l'API reelle d'Odoo est sous
# /web/dataset/call_kw, /jsonrpc, /xmlrpc/2/*). ATTENTION toutefois : si un module tiers ou OCA (ex. graphql_base,
# ou une integration maison) expose volontairement une route sous /api ou /graphql sur cette instance, cette regle
# la bloquera aussi — verifier les modules installes avant d'activer si un doute existe.
location ~* ^/(graphql|api)(/|$) {
    return 404;
    access_log /var/log/nginx/blocked-probes.log combined_host;   # journal dédié (jail nginx-blocked-probes)
    log_not_found off;
}
