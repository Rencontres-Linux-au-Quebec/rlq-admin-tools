#
# HSTS pour les blocs server qui ne passent PAS par _odoo-common.conf (qui porte déjà son propre HSTS à
# max-age=31536000, servi uniquement par le vhost www canonique). Sans ce fichier, un client qui tape
# https://<domaine>/ ou https://odoo18.<domaine>/ directement (sans passer par le
# port 80) ne recevait JAMAIS d'en-tête HSTS, même si sa redirection 301 vers www fonctionne correctement —
# HSTS doit être présent sur CHAQUE réponse d'un nom public, redirection comprise, pour que le navigateur retienne
# la consigne "toujours HTTPS" avant même le premier aller-retour.
#
# max-age volontairement COURT (300s = 5 min) au départ : une valeur longue mal testée est difficile à corriger
# rapidement (le navigateur retient la consigne pour toute la durée, même si vous reculez). Une fois confirmé sans
# problème pendant quelques jours (aucune plainte d'accès bloqué, aucun souci de certificat), remonter à
# max-age=31536000 pour matcher la valeur déjà utilisée dans _odoo-common.conf.
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
