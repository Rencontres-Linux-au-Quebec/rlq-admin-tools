# ======================================================================================================================
# _odoo-common.conf — corps COMMUN à toutes les instances Odoo (PROD/DEV/LAB), compatible Odoo 18/19/20 CE
# ======================================================================================================================
# Ne PAS activer ce fichier directement (le "_" initial le rappelle) : il ne contient aucun bloc "server", seulement des
# directives à inclure DANS un bloc server déjà ouvert par un vhost d'instance.
#
# Prérequis, à faire dans CET ORDRE dans le vhost qui inclut ce fichier :
#   1) set $odoo_backend      <nom_upstream_http>;        (ex.: odoo)
#      set $odoo_backend_chat <nom_upstream_gevent>;       (ex.: odoo_chat)
#   2) include .../<instance>.name.conf;    (server_name)
#   3) include .../<instance>.ssl.conf;     (certificats + logs)
#   4) include .../env-<dev|lab|prod>.conf; (réglages propres à l'environnement)
#   5) include .../_odoo-common.conf;       (CE FICHIER, en dernier)
#
# Prérequis globaux (contexte http{}, une seule fois pour tout le serveur) : voir conf.d/odoo-global.conf
#   - map $connection_upgrade
#   - proxy_cache_path (zone "odoo_cache")
#   - map $is_bad_bot -> doit déjà exister ailleurs (utilisé par securite-commune.conf)
#
# Compatibilité versions Odoo : ce fichier ne dépend d'aucune spécificité de version. Le websocket temps réel (chat,
# notifications) est servi par Odoo sous /websocket depuis la v16 et le reste sous Odoo 18, 19 et 20 CE. Le seul point
# qui varie côté Odoo est le NOM du paramètre dans config.conf : "gevent_port" (18/19/20 — anciennement "longpolling_port"
# avant la v16). C'est un réglage d'Odoo, pas de nginx : ce fichier proxifie simplement le port que vous avez déclaré
# dans l'upstream $odoo_backend_chat, quel que soit le nom de la variable côté Odoo.
# ======================================================================================================================

# ------------------------------------------------------------------------------------------------------------------
# Durcissement TLS pour un bon pointage Qualys SSL Labs / testssl.sh.
# NE PAS toucher à options-ssl-nginx.conf (géré par Certbot, déjà un bon profil "Intermediate" Mozilla : TLSv1.2/1.3
# uniquement, suites AEAD sans RC4/3DES/NULL — voir le commentaire en tête de ce fichier). Tout ajout va ici plutôt,
# pour ne jamais perdre les mises à jour automatiques de sécurité de Certbot sur ce fichier.
#
# PAS de ssl_stapling ici : Let's Encrypt a retiré les URLs de repondeur OCSP de tous ses certificats a partir du
# 7 mai 2025 et a eteint son service OCSP le 6 aout 2025 (passage exclusif aux CRL). Un certificat Let's Encrypt
# emis apres cette date n'a donc plus d'URL OCSP a stapler : activer ssl_stapling produit uniquement un
# avertissement permanent ("no OCSP responder URL in the certificate") a chaque "nginx -t", sans aucun benefice.
# Si un jour un certificat d'une AUTRE autorite (qui supporte encore OCSP) est utilise ici, la directive peut etre
# reintroduite pour ce vhost precis.
# ------------------------------------------------------------------------------------------------------------------

# En-têtes informant Odoo du contexte réel de la requête (le client parle à nginx en HTTPS, nginx parle à Odoo en HTTP local).
# RÈGLE D'HÉRITAGE À CONNAÎTRE : nginx n'hérite ces proxy_set_header dans un "location" QUE si ce location ne déclare
# lui-même AUCUN proxy_set_header (sinon il perd TOUS ceux du niveau parent, pas juste ceux qu'il redéfinit). Les
# location "/web/database/manager" (env-*.conf) ne déclarent aucun proxy_set_header : ils héritent donc correctement
# les 5 lignes ci-dessous, même si env-*.conf est inclus AVANT ce fichier — l'ordre des include n'a pas d'importance
# ici, nginx fusionne par arborescence de contextes (serveur → location), pas en exécutant le fichier ligne par ligne.
# Si un jour un de ces location ajoute son propre proxy_set_header (ex.: pour un Upgrade/Connection), il faudra alors
# y recopier explicitement les 5 lignes suivantes.
#
# BUG CORRIGE : sans "proxy_set_header Host" explicite, nginx envoie par défaut à Odoo le Host correspondant au nom
# de l'upstream utilisé dans proxy_pass (ici la variable $odoo_backend, ex. "odoo") plutôt que le vrai nom de domaine
# demandé par le client. Résultat observé : le module auth_oauth (connexion "Se connecter avec Google") construit
# son redirect_uri à partir de ce Host brut plutôt que de X-Forwarded-Host, produisant une URL de retour invalide
# du type "http://odoo/auth_oauth/signin" que Google rejette (invalid_request). X-Forwarded-Host seul ne suffit pas
# pour CETTE route précise d'Odoo — le Host lui-même doit porter le vrai domaine.
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP         $remote_addr;

# "always" est requis pour que ces en-têtes soient aussi envoyés sur les réponses d'erreur (403/404/405 générées par
# securite-commune.conf), pas seulement sur les réponses normales 2xx/3xx.
add_header X-Frame-Options           "SAMEORIGIN" always;
# X-XSS-Protection "1; mode=block" est obsolète (retiré des navigateurs modernes) et son "XSS Auditor" a eu ses propres
# failles par le passé (fuite d'info par canal auxiliaire). "0" désactive explicitement ce mécanisme legacy, comme le
# recommandent OWASP et les scanners d'audit actuels — plutôt que de laisser une valeur qui n'a plus d'effet réel.
add_header X-XSS-Protection          "0" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
# geolocation reste bloquée (non utilisée). Caméra/micro autorisés pour ce domaine ("self") : requis par l'app Barcode
# (scan via caméra du navigateur) et par l'intégration Jitsi pour les appels vidéo.
# ATTENTION si Jitsi est hébergé sur un AUTRE domaine (ex.: meet.jit.si plutôt qu'un Jitsi auto-hébergé sous
# <domaine>) : "self" ne couvre que ce domaine-ci. Un appel vidéo affiché dans un <iframe> pointant vers
# un domaine tiers a besoin que CE domaine tiers soit explicitement ajouté ici, ex. :
#   camera=(self "https://meet.jit.si"), microphone=(self "https://meet.jit.si")
# et que la balise <iframe> porte elle-même l'attribut allow="camera; microphone" (délégation de permission HTML,
# indépendante de cet en-tête). Si les appels Jitsi fonctionnent déjà en test après ce changement, aucune action
# supplémentaire n'est requise — Jitsi tourne probablement sur ce domaine.
add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=(self)" always;

# Tampons proxy agrandis pour les grosses réponses Odoo (listes, rapports) sans que nginx doive écrire sur disque temporaire.
proxy_buffers 16 64k;
proxy_buffer_size 128k;

proxy_read_timeout    720s;
proxy_connect_timeout 720s;
proxy_send_timeout    720s;

# Bascule vers un autre worker si le backend ne répond pas ou plante.
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;

# Sans ceci, error_page 502/503/504 (page de maintenance, plus bas) n'intercepte QUE les erreurs générées par
# nginx lui-même (ex. connexion refusée quand rien n'écoute) — pas un 502/503/504 explicitement renvoyé PAR ODOO
# LUI-MÊME (comportement courant pendant son démarrage, avant que les workers soient prêts). Sans cette ligne, un
# tel cas passerait tel quel (avec le Content-Type minimal/incorrect d'Odoo à ce stade) plutôt que d'afficher
# notre page de maintenance — symptôme observé : le fichier de maintenance se télécharge de nouveau, mais
# seulement pendant la fenêtre de démarrage d'Odoo, pas quand il est complètement arrêté.
proxy_intercept_errors on;

# Coupe les connexions dont le premier message n'est pas un vrai HTTP valide (sondes de scan de masse type zgrab).
error_page 400 =444 /dev/null;

# BUG CORRIGE : un bloc "types {}" a ce niveau REMPLACE entièrement la table MIME héritée du niveau http (où
# Debian charge /etc/nginx/mime.types) plutôt que de s'y ajouter — documenté par le tracker officiel de nginx
# (ticket #738 : "la bonne façon d'étendre mime.types est de l'inclure dans la MÊME section : include mime.types;
# types { ... }"). Sans ce ré-include, SEULES .less et .scss ci-dessous étaient reconnues ici : tout le reste
# (dont .html) retombait sur application/octet-stream — invisible tant que tout passait par proxy_pass vers Odoo
# (qui gère son propre Content-Type), mais cassait le tout premier contenu servi directement par nginx lui-même
# (la page de maintenance ci-dessous) : le navigateur la téléchargeait au lieu de l'afficher.
include /etc/nginx/mime.types;
types {
    text/less less;
    text/scss scss;
}

# Compression des réponses textuelles pour réduire la bande passante. JPEG/PNG/PDF sont retirés de la liste : ce sont
# des formats déjà compressés en interne, les regzipper ne réduit quasiment pas leur taille mais consomme du CPU pour
# rien. Odoo, par contre, utilise beaucoup de SVG (icônes, illustrations vectorielles) — du XML texte, qui compresse
# très bien et n'était pas dans la liste d'origine.
gzip on;
gzip_min_length 1100;
gzip_buffers 4 32k;
gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript image/svg+xml;
gzip_vary on;

client_header_buffer_size 4k;
large_client_header_buffers 4 64k;

# Règles communes de durcissement (bots, extensions sensibles, sondes, etc.). Couvre déjà les fichiers cachés (.git,
# .env) et /dns-query|query|resolve : inutile de les redéclarer dans les fichiers d'instance.
#
# Note sur le "if is evil" (piège nginx classique) : securite-commune.conf utilise "if ($cond) { return xxx; }" à ce
# niveau serveur (jamais imbriqué dans un "location"). C'est précisément le seul usage que le wiki nginx qualifie de
# sûr à 100 % ("if" + un simple "return", rien d'autre dedans). Un "if" au niveau serveur s'exécute en phase
# "rewrite", AVANT la sélection du "location" — donc $is_bad_bot est évalué pour CHAQUE requête sur ce serveur, y
# compris celles qui seront ensuite servies par un "location ~ ... /static/" ou un autre bloc regex plus bas : rien
# n'est contourné. Un test manuel (curl avec un User-Agent de la liste, contre un chemin /*/static/) reste une bonne
# vérification empirique après déploiement, mais il n'y a pas de faille architecturale ici.
include /etc/nginx/snippets/securite-commune.conf;

# Exception à la règle 5 de securite-commune.conf (qui bloque les .txt) : /robots.txt est généré dynamiquement par
# Odoo (module website) et doit être proxifié normalement. Placé ICI plutôt que dans securite-commune.conf lui-même
# car ce fichier-ci n'est inclus QUE par les vhosts où $odoo_backend est défini (voir "set $odoo_backend ...;" dans
# chaque fichier sites-available/*.conf) — securite-commune.conf est aussi inclus par les blocs HTTP port 80 (pour
# le durcissement même avant la redirection vers https), où $odoo_backend n'existe pas : y proxifier vers une
# variable vide casse nginx ("invalid URL prefix in http://"). Un "location =" reste prioritaire sur la règle 5
# (regex) peu importe le fichier d'où il vient, tant que les deux sont dans le même bloc server.
# Instances non publiques ($robots_disallow_all = 1, voir le map dans conf.d/odoo-global.conf) : réponse directe
# « tout interdit », produite pendant la phase de réécriture, donc AVANT le contrôle d'accès par IP (deny all de DEV) —
# servie à tout le monde, pour que les robots polis cessent de revenir. Un « if » ne contenant qu'un « return » est
# l'un des rares usages sûrs de « if » dans une location (documentation nginx). Les en-têtes add_header du niveau
# server (HSTS, X-Robots-Tag de DEV…) restent hérités : cette location n'en définit aucun.
location = /robots.txt {
    default_type text/plain;
    if ($robots_disallow_all) {
        return 200 "User-agent: *\nDisallow: /\n";
    }
    proxy_pass http://$odoo_backend;
}

# Icône d'écran d'accueil demandée D'ELLE-MÊME par Safari / iOS / Android (et les aperçus de lien) à la racine du site :
# /apple-touch-icon.png, /apple-touch-icon-precomposed.png, /apple-touch-icon-120x120.png…, avec ou sans préfixe de langue
# (/en_CA/…). Ces fichiers n'existent pas : Odoo répondait 303 puis une page 404 COMPLÈTE (~26 requêtes SQL, ~0,3 s de calcul)
# à chaque visiteur, et le journal se remplissait de 404. On sert à la place l'icône d'application du site (Odoo ▸ Site web ▸
# Configuration ▸ Paramètres), en 180x180 (la taille d'iOS), par une réécriture INTERNE — pas une redirection : iOS ne suit pas
# toujours une redirection pour cette icône. « rewrite … break » suivi d'un proxy_pass avec variable : nginx transmet alors
# l'URI RÉÉCRIT à Odoo. Aucun proxy_set_header ici : ils sont hérités du niveau serveur (règle d'héritage décrite plus haut).
# L'expression est entre guillemets à cause de « {2} ». 1 = le site web d'Odoo (un seul site sur ce serveur) ; si l'icône n'est pas
# configurée dans Odoo, la réponse redevient un 404, comme avant. Ancrée au début : /web/image/…/apple-touch-icon.png (une pièce
# jointe) et /web/content/… ne sont jamais touchés.
location ~ "^/(?:[a-z]{2}(?:_[A-Z]{2})?/)?apple-touch-icon(?:-[0-9]+x[0-9]+)?(?:-precomposed)?\.png$" {
    limit_req zone=odoo_general burst=10 nodelay;
    limit_req zone=odoo_curl burst=10 nodelay;                   # rafale de curl (voir securite-commune.conf, regle 1 bis)
    rewrite ^ /web/image/website/1/app_icon/180x180 break;
    proxy_pass http://$odoo_backend;
    proxy_redirect off;
    proxy_http_version 1.1;
}

# Billets d'evenement demandes SANS parametres (/event/<id>/my_tickets) : Odoo 18 leve une TypeError (500) car la methode
# exige registration_ids et tickets_hash. Sans chaine de requete, on repond 404 tout de suite, sans calcul Odoo. Les vrais liens
# portent toujours ?registration_ids=...&tickets_hash=... et sont transmis normalement. Prefixe de langue optionnel (/en_CA/...).
# Les proxy_set_header sont repetes ici : un location qui en declare un perd l'heritage de tous ceux du niveau parent (voir location / plus bas).
location ~ "^(?:/[a-z]{2}_[A-Z]{2})?/event/[0-9]+/my_tickets$" {
    if ($args = "") {
        return 404;
    }
    proxy_pass http://$odoo_backend;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
}

location / {
    # Garde-fou général contre l'abus grossier. burst=60 nodelay absorbe une rafale de chargement de page normale
    # (plusieurs dizaines de ressources en parallèle) sans délai artificiel ; au-delà, 429.
    limit_req zone=odoo_general burst=60 nodelay;
    limit_req zone=odoo_general_partage burst=180 nodelay;      # réseaux partagés (lieux [partagée]) : clé vide pour tout le monde d'autre
    # Tentatives de connexion seulement (clé vide pour tout le reste, voir $limit_key_login dans odoo-global.conf).
    # Placé ici plutôt que dans une location dédiée : une nouvelle location devrait redéclarer tous les
    # proxy_set_header ci-dessous (voir le bug d'héritage décrit plus bas).
    limit_req zone=odoo_login burst=5 nodelay;
    limit_req zone=odoo_login_partage burst=25 nodelay;
    limit_req zone=odoo_curl burst=10 nodelay;                   # rafale de curl (voir securite-commune.conf, regle 1 bis)
    # Connexions simultanées par cookie de visiteur (conflits d'écriture website_visitor d'Odoo, voir odoo-global.conf) ; clé vide = pas de limite.
    limit_conn odoo_visiteur 8;
    proxy_pass http://$odoo_backend;
    proxy_redirect off;
    proxy_http_version 1.1;
    # Upgrade/Connection ne passent en mode "upgrade" que si la requête le demande vraiment (map $connection_upgrade,
    # voir odoo-global.conf) : le trafic HTTP normal profite alors du keep-alive vers Odoo.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # BUG CORRIGE (severe) : ce location declare deja 2 proxy_set_header ci-dessus (Upgrade/Connection). Des qu'un
    # location declare NE SERAIT-CE QU'UN SEUL proxy_set_header, il perd l'heritage de TOUS ceux du niveau parent —
    # pas seulement celui qu'il redefinit (voir la note plus haut dans ce fichier). Consequence reelle observee :
    # Host/X-Forwarded-Host/For/Proto/X-Real-IP ne parvenaient JAMAIS a Odoo pour ce location (donc pour la quasi-
    # totalite du trafic du site), meme apres les avoir ajoutes au niveau serveur. Symptome concret : le module
    # auth_oauth (connexion Google) construit son redirect_uri via request.httprequest.url_root, qui se rabattait
    # alors sur le nom de l'upstream ("odoo") plutot que le vrai domaine — "invalid_request" cote Google. D'ou la
    # repetition explicite ci-dessous, plutot que de compter sur l'heritage depuis le niveau serveur.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
}

# Formes SVG décoratives du constructeur de site (/web_editor/shape/). 1.16 : la zone stricte odoo_shapes (une requête toutes les 3 s par IP)
# a été retirée de cette route : elle coupait le chargement normal de l'éditeur (une soixantaine de formes par page « Partenaires » ou page
# d'accueil) et renvoyait des 429 à une session connectée et légitime. Limite générale plus haute à la place. Cette route ne fait pas partie
# du cache statique (~ /static/ plus bas) : son SVG dépend des paramètres de couleur dans l'URL, donc chaque variante repasse par Odoo.
location ~ ^/web_editor/shape/ {
    limit_req zone=odoo_general burst=120 nodelay;
    limit_req zone=odoo_curl burst=10 nodelay;                   # rafale de curl uniquement (voir securite-commune.conf, regle 1 bis)
    proxy_pass http://$odoo_backend;
    proxy_redirect off;
    proxy_http_version 1.1;
}

location /websocket {
    proxy_pass http://$odoo_backend_chat;
    proxy_http_version 1.1;
    # Ici l'upgrade est systématiquement nécessaire : c'est le canal websocket permanent utilisé par le bus Odoo
    # (chat/notifications temps réel), servi par le serveur gevent d'Odoo sur le port déclaré dans $odoo_backend_chat.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;
    # Même bug d'héritage que "location /" ci-dessus (Upgrade/Connection déclarés ici annulent l'héritage des
    # en-têtes du niveau serveur) : répétés explicitement pour la même raison.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
}

# Cache en mémoire les fichiers statiques (JS/CSS compilés) 60 min, et les 404 1 min (évite de re-frapper Odoo pour un
# fichier déjà absent).
location ~ /[a-zA-Z0-9_-]*/static/ {
    proxy_cache odoo_cache;
    proxy_cache_valid 200 302 60m;
    proxy_cache_valid 404 1m;
    proxy_buffering on;
    expires 864000;
    proxy_pass http://$odoo_backend;
}

# ------------------------------------------------------------------------------------------------------------------
# Page de maintenance automatique : se déclenche TOUTE SEULE quand Odoo est injoignable (arrêt planifié pour
# redémarrage/mise à jour, ou crash), disparaît TOUTE SEULE dès qu'Odoo répond de nouveau — aucune manipulation à
# faire au moment de l'arrêt. 502 = upstream refuse la connexion (Odoo arrêté) ; 503/504 = upstream surchargé ou
# trop lent à répondre. Le "=" (sans code explicite) GARDE le vrai statut HTTP (502/503/504) sur la réponse finale
# — seul le CONTENU de la page change, pas le code retourné aux navigateurs/robots (important : évite qu'un moteur
# de recherche indexe la page de maintenance comme si c'était du vrai contenu).
error_page 502 503 504 = @maintenance;
location @maintenance {
    root /var/www/maintenance;
    add_header Retry-After 120 always;
    rewrite ^ /index.html break;
}
