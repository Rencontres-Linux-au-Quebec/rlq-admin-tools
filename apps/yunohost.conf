# Profil d'application : YunoHost (nginx géré par « yunohost tools regen-conf nginx »). Tout ce qui est PROPRE à YunoHost
# est ici ; le reste (nginx, pare-feu, fail2ban, bannissements) est commun et reste dans les programmes. Format : CLÉ="valeur",
# lisible par bash (source) et par Python (apps/_profile.py). Valeurs à vérifier sur un serveur réel : voir CHANGELOG.md.

# YunoHost est une PLATEFORME : plusieurs applications y cohabitent, chacune sur son domaine (par exemple Nextcloud,
# Mattermost, Tiki et diagrams.net sur le serveur de référence). Ces applications ne s'excluent pas comme Odoo et BBB :
# leur liste vient de /etc/yunohost/apps/ et leur domaine de leur configuration, lus par les programmes (voir PR 3).
APP_NAME="yunohost"
APP_LABEL="YunoHost"

# Détection automatique : YunoHost est présent si UN des fichiers existe (APP_DETECT_ROOT préfixe les chemins pendant les tests).
DETECT_UNITS=""
DETECT_FILES="/etc/yunohost/current_host /etc/yunohost/installed"
DETECT_ODOO_CONF="no"

# Services mesurés (ressources, état) : seuls ceux qui existent sur le serveur sont retenus. nginx est toujours ajouté.
SERVICES="yunohost-portal-api.service"

# Journaux nginx : YunoHost écrit un journal par domaine (equipe.<domaine>-access.log, nuage.<domaine>-access.log, ...) et
# des rotations compressées (.N.gz) dans /var/log/nginx. Pas de capteur catch-all propre à YunoHost.
ACCESS_LOGS="*-access.log"
ERROR_LOGS="*-error.log"
CATCHALL_LOG=""

# Journal de l'application : fichier (APP_LOG_FILES). Le journal SSO de YunoHost (ssowat) est lu par les programmes.
APP_LOG_KIND="file"
APP_LOG_FILES="/var/log/nginx/ssowat.log"

# Terminaison TLS : nginx écoute le 443 (les certificats sont gérés par YunoHost, dans /etc/yunohost/certs).
TLS_TERMINATION="nginx"

# Jeu de vérifications de app-health-check.py (générique : aucune vérification propre à Odoo ou BBB).
HEALTH_CHECKS="yunohost"

# Pages de connexion (limite de débit, fail2ban) et chemins d'administration à réserver aux IP autorisées.
LOGIN_PATHS="/yunohost/sso/"
ADMIN_PATHS="/yunohost/admin/ /yunohost/api/"

# Ports des serveurs d'application qui ne doivent JAMAIS être joignables de l'extérieur : aucun pour l'instant. Les
# applications YunoHost (nextcloud, mattermost, tiki, diagramsnet) sont liées par YunoHost ; à compléter après vérification.
BACKEND_PORTS=""

# Étapes de nginx-hardening.sh propres à Odoo : désactivées pour YunoHost.
ODOO_SPECIFIC_STEPS="no"
# Configuration de durcissement nginx livrée pour cette application : aucune pour l'instant (voir la PR 2).
HARDENING_CONFIG=""
