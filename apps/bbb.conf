# Profil d'application : BigBlueButton 3.0 (établi sur une vraie installation 3.0.37 : bbb-conf --status, nginx, ufw).
# Particularités par rapport à Odoo :
#   - TLS terminé par HAProxy sur le 443 ; nginx n'écoute que 127.0.0.1:81/82 avec le protocole PROXY (les vraies IP
#     des clients sont bien dans le journal grâce à « real_ip_header proxy_protocol ») ;
#   - pare-feu ufw installé et activé par BBB (22, 80, 443, 3478, 16384:32768/udp) : jamais d'iptables-persistent ;
#   - configuration nginx GÉRÉE par BBB (/etc/nginx/sites-available/bigbluebutton, /etc/bigbluebutton/nginx/) : ne
#     jamais la modifier directement — un durcissement BBB passera par des ajouts (à venir).

APP_NAME="bbb"
APP_LABEL="BigBlueButton"

DETECT_UNITS="bbb-web.service"
DETECT_FILES="/usr/bin/bbb-conf /etc/bigbluebutton/bigbluebutton-release"

SERVICES="freeswitch.service redis-server.service bbb-apps-akka.service bbb-fsesl-akka.service postgresql@*.service bbb-graphql-actions.service bbb-graphql-middleware.service bbb-graphql-server.service bbb-webrtc-sfu.service bbb-webrtc-recorder.service etherpad.service bbb-web.service bbb-pads.service bbb-export-annotations.service bbb-rap-caption-inbox.service bbb-rap-resque-worker.service bbb-rap-starter.service haproxy.service"

ACCESS_LOGS="bigbluebutton.access.log"
ERROR_LOGS="error.log"
CATCHALL_LOG=""

APP_LOG_KIND="file"
APP_LOG_FILES="/var/log/bigbluebutton/bbb-web.log"

TLS_TERMINATION="haproxy"
HEALTH_CHECKS="bbb"

# Pas de page de connexion propre à BBB (l'accès aux réunions passe par l'API signée ou par Greenlight, absent ici).
LOGIN_PATHS=""
ADMIN_PATHS=""
# Services internes de BBB : liés à 127.0.0.1 par l'installateur, rien à vérifier côté pare-feu ici.
BACKEND_PORTS=""

ODOO_SPECIFIC_STEPS="no"
# Aucune configuration de durcissement nginx livrée pour BBB pour l'instant (à venir).
HARDENING_CONFIG=""
