# Profil d'application : Odoo (ERPLibre) derrière nginx. Tout ce qui est PROPRE à l'application est ici ; le reste
# (nginx, pare-feu, fail2ban, CrowdSec, bannissements) est commun et reste dans les programmes. Format : CLÉ="valeur",
# lisible par bash (source) et par Python (apps/_profile.py). Ajouter une application = ajouter un fichier comme celui-ci.

APP_NAME="odoo"
APP_LABEL="Odoo"

# Détection automatique : l'application est présente si UNE des unités systemd existe, ou UN des fichiers.
DETECT_UNITS="erplibre.service erplibre_erplibre.service odoo.service"
DETECT_FILES=""
# « yes » : un fichier de configuration d'Odoo trouvé (liste ODOO_CONF_PATHS, voir apps/_odoo_conf.sh) suffit à reconnaître l'application ;
# ses ports et son journal (logfile) sont alors lus dans ce fichier.
DETECT_ODOO_CONF="yes"

# Services mesurés (ressources, état) — seuls ceux qui existent sur le serveur sont retenus. nginx est toujours ajouté.
SERVICES="erplibre.service erplibre_erplibre.service odoo.service postgresql@*.service"

# Journaux nginx du site, dans /var/log/nginx (motifs) ; capteur catch-all de la configuration nginx-odoo.
ACCESS_LOGS="*-access.log"
ERROR_LOGS="*-error.log"
CATCHALL_LOG="odoo-catchall-444.log"

# Journal de l'application : « journal » (systemd, unité détectée) ou « file » (fichiers de APP_LOG_FILES).
APP_LOG_KIND="journal"
APP_LOG_FILES=""

# Terminaison TLS : « nginx » (nginx écoute le 443) ou « haproxy » (HAProxy devant nginx, protocole PROXY).
TLS_TERMINATION="nginx"

# Jeu de vérifications de app-health-check.py.
HEALTH_CHECKS="odoo"

# Pages de connexion (limite de débit, fail2ban) et chemins d'administration à réserver aux IP autorisées.
LOGIN_PATHS="/web/login /web/login/totp /web/session/authenticate"
ADMIN_PATHS="/web/database/ /xmlrpc/db /xmlrpc/2/db"

# Ports du serveur d'application qui ne doivent JAMAIS être joignables de l'extérieur (étape 4 de nginx-hardening.sh).
BACKEND_PORTS="10000 10002"

# Étapes de nginx-hardening.sh propres à Odoo (limites mémoire, unité systemd, odoo.conf, jail odoo-auth) : actives.
ODOO_SPECIFIC_STEPS="yes"
# Configuration de durcissement nginx livrée pour cette application (nginx-odoo-config.zip) : déployée.
HARDENING_CONFIG="nginx-odoo"
