# /etc/opendkim.conf — signature DKIM des courriels sortants (MODE B, ou MODE A si le relais ne signe pas).
# Installation : apt install opendkim opendkim-tools
# Clé (une fois) :
#   install -d -o opendkim -g opendkim -m 750 /etc/opendkim/keys/rencontres-linux.quebec
#   opendkim-genkey -b 2048 -d rencontres-linux.quebec -s 2026a -D /etc/opendkim/keys/rencontres-linux.quebec
#   chown opendkim:opendkim /etc/opendkim/keys/rencontres-linux.quebec/2026a.private && chmod 600 /etc/opendkim/keys/rencontres-linux.quebec/2026a.private
# Le fichier 2026a.txt contient l'enregistrement DNS à publier (voir dns-zone.txt). Sélecteur = année + lettre : changer de clé tous les 6 à 12 mois.
Syslog                  yes
SyslogSuccess           yes
UMask                   007
UserID                  opendkim
PidFile                 /run/opendkim/opendkim.pid
Socket                  inet:8891@127.0.0.1

Mode                    s
Domain                  rencontres-linux.quebec
Selector                2026a
KeyFile                 /etc/opendkim/keys/rencontres-linux.quebec/2026a.private
Canonicalization        relaxed/simple
SubDomains              no
# Signe aussi les en-têtes From en double : empêche d'en ajouter un second après la signature.
OversignHeaders         From
# Ne signe que le courrier venant de la machine elle-même (Odoo, cron, outils) :
InternalHosts           127.0.0.1, ::1, localhost
